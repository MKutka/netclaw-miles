<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netclaw-Miles — Codebase Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 100;
  }
  #toolbar h1 { font-size: 15px; font-weight: 600; color: #58a6ff; margin-right: 8px; }
  #toolbar h1 span { color: #7ee787; }

  .tb-sep { width: 1px; height: 28px; background: #30363d; }

  .tb-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #c9d1d9;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .tb-btn:hover { background: #30363d; border-color: #58a6ff; color: #58a6ff; }
  .tb-btn.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }

  #search-box {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #c9d1d9;
    font-size: 12px;
    width: 180px;
    outline: none;
  }
  #search-box:focus { border-color: #58a6ff; }
  #search-box::placeholder { color: #484f58; }

  .layer-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .layer-toggle input[type=checkbox] { accent-color: #58a6ff; cursor: pointer; }

  #match-count { font-size: 11px; color: #8b949e; min-width: 70px; }

  /* ── Canvas ── */
  #canvas-wrap {
    position: fixed;
    top: 52px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    cursor: grab;
  }
  #canvas-wrap.dragging { cursor: grabbing; }
  #canvas {
    position: absolute;
    transform-origin: 0 0;
  }

  /* ── Legend ── */
  #legend {
    position: fixed;
    bottom: 16px;
    left: 16px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    z-index: 50;
  }
  #legend h3 { font-size: 11px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .leg-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  /* ── Info panel ── */
  #info-panel {
    position: fixed;
    top: 68px;
    right: 16px;
    width: 300px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
    font-size: 12px;
    z-index: 50;
    display: none;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
  }
  #info-panel.visible { display: block; }
  #info-panel h2 { font-size: 14px; margin-bottom: 8px; }
  #info-panel .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
    margin: 2px;
  }
  #info-panel .meta { color: #8b949e; margin: 6px 0 4px; font-size: 11px; }
  #info-panel ul { padding-left: 16px; }
  #info-panel ul li { margin: 3px 0; line-height: 1.4; }
  #info-panel .close-btn {
    float: right;
    cursor: pointer;
    color: #8b949e;
    font-size: 16px;
    line-height: 1;
    margin-top: -2px;
  }
  #info-panel .close-btn:hover { color: #c9d1d9; }
  #info-panel .path { font-family: monospace; font-size: 11px; color: #79c0ff; word-break: break-all; }
  #info-panel hr { border: none; border-top: 1px solid #30363d; margin: 10px 0; }

  /* ── Zoom controls ── */
  #zoom-ctrl {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 50;
  }
  .zoom-btn {
    width: 32px; height: 32px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .zoom-btn:hover { background: #21262d; border-color: #58a6ff; color: #58a6ff; }

  /* ── Nodes ── */
  .node {
    position: absolute;
    border-radius: 8px;
    border: 1.5px solid;
    padding: 10px 14px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .2s;
    user-select: none;
    min-width: 120px;
  }
  .node:hover { transform: scale(1.04); box-shadow: 0 0 0 2px rgba(88,166,255,.5), 0 4px 20px rgba(0,0,0,.6); }
  .node.selected { box-shadow: 0 0 0 2px #58a6ff, 0 4px 20px rgba(0,0,0,.6); }
  .node.dimmed { opacity: .2; }
  .node.highlighted { opacity: 1; }

  .node-title { font-weight: 600; font-size: 12px; white-space: nowrap; }
  .node-sub   { font-size: 10px; color: #8b949e; margin-top: 3px; white-space: nowrap; }
  .node-badge {
    position: absolute;
    top: -7px; right: 8px;
    background: #1f6feb;
    border-radius: 8px;
    font-size: 9px;
    padding: 1px 6px;
    color: #fff;
    white-space: nowrap;
  }

  /* Layer colours */
  .layer-user    { background: #0d2033; border-color: #388bfd; }
  .layer-agent   { background: #0a1f0a; border-color: #3fb950; }
  .layer-skills  { background: #1a1230; border-color: #bc8cff; }
  .layer-mcp     { background: #1f1a0a; border-color: #d29922; }
  .layer-platform{ background: #1f0a0a; border-color: #f85149; }
  .layer-infra   { background: #0a1a1f; border-color: #39c5cf; }

  /* ── SVG edges ── */
  #svg-layer {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }
  .edge { fill: none; stroke-width: 1.5; opacity: .45; }
  .edge.flow { stroke-dasharray: 8 4; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -48; } }
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <h1>Netclaw-<span>Miles</span></h1>
  <div class="tb-sep"></div>
  <button class="tb-btn active" onclick="setView('all')">All Layers</button>
  <button class="tb-btn" onclick="setView('agent')">Agent Core</button>
  <button class="tb-btn" onclick="setView('mcp')">MCP Servers</button>
  <button class="tb-btn" onclick="setView('skills')">Skills</button>
  <button class="tb-btn" onclick="setView('platforms')">Platforms</button>
  <div class="tb-sep"></div>
  <input id="search-box" type="text" placeholder="Search nodes…" oninput="doSearch(this.value)">
  <span id="match-count"></span>
  <div class="tb-sep"></div>
  <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('user',this.checked)"> <span style="color:#388bfd">● User</span></label>
  <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('agent',this.checked)"> <span style="color:#3fb950">● Agent</span></label>
  <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('skills',this.checked)"> <span style="color:#bc8cff">● Skills</span></label>
  <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('mcp',this.checked)"> <span style="color:#d29922">● MCP</span></label>
  <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('platform',this.checked)"> <span style="color:#f85149">● Platforms</span></label>
  <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('infra',this.checked)"> <span style="color:#39c5cf">● Infra</span></label>
</div>

<!-- Info panel -->
<div id="info-panel">
  <span class="close-btn" onclick="closeInfo()">×</span>
  <div id="info-content"></div>
</div>

<!-- Zoom -->
<div id="zoom-ctrl">
  <div class="zoom-btn" onclick="zoom(1.2)">+</div>
  <div class="zoom-btn" onclick="zoom(0.8)">−</div>
  <div class="zoom-btn" onclick="resetView()" style="font-size:12px;">⌂</div>
</div>

<!-- Legend -->
<div id="legend">
  <h3>Layers</h3>
  <div class="leg-item"><div class="leg-dot" style="background:#388bfd"></div> User / Input</div>
  <div class="leg-item"><div class="leg-dot" style="background:#3fb950"></div> Agent Core</div>
  <div class="leg-item"><div class="leg-dot" style="background:#bc8cff"></div> Skills (77)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#d29922"></div> MCP Servers (32+)</div>
  <div class="leg-item"><div class="leg-dot" style="background:#f85149"></div> Network Platforms</div>
  <div class="leg-item"><div class="leg-dot" style="background:#39c5cf"></div> Infrastructure</div>
</div>

<!-- Canvas -->
<div id="canvas-wrap">
  <div id="canvas">
    <svg id="svg-layer"></svg>
  </div>
</div>

// ─────────────────────────────────────────
// LAYOUT ADJUSTMENTS — remove duplicate mcp nodes shown above
// We rendered grafana/prometheus/kubeshark as part of mcp-misc visually
// Just hide them from the node list
// ─────────────────────────────────────────
const VISIBLE_NODES = NODES.filter(n => !['mcp-grafana','mcp-prometheus','mcp-kubeshark'].includes(n.id));

// ─────────────────────────────────────────
// VIEW PRESETS
// ─────────────────────────────────────────
const VIEWS = {
  all:       null, // show everything
  agent:     ['user-cli','user-slack','openclaw-framework','claude-ai','soul-md','user-md','tools-md','workspace','gait-md','env-file'],
  mcp:       ['skills-meraki','skills-sot','skills-cloud','skills-proto','skills-util','mcp-meraki','mcp-gait','mcp-netbox','mcp-nautobot','mcp-infrahub','mcp-aws','mcp-gcp','mcp-protocol','mcp-misc'],
  skills:    ['workspace','skills-device','skills-meraki','skills-sot','skills-cloud','skills-observe','skills-proto','skills-util'],
  platforms: ['mcp-meraki','mcp-gait','mcp-netbox','mcp-aws','mcp-gcp','mcp-protocol','mcp-misc','platform-cisco','platform-meraki','platform-sot','platform-itsm','platform-cloud','platform-observe','platform-git','platform-comms'],
};

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const svgLayer= document.getElementById('svg-layer');
let scale = 0.72, panX = 20, panY = 20;
let dragging = false, dragStartX, dragStartY, panStartX, panStartY;
let selectedNode = null;
let hiddenLayers = new Set();
let currentView  = 'all';
let searchTerm   = '';

function nodeById(id) { return VISIBLE_NODES.find(n => n.id === id); }

function renderNodes() {
  // Remove old node divs
  canvas.querySelectorAll('.node').forEach(el => el.remove());

  VISIBLE_NODES.forEach(n => {
    if (hiddenLayers.has(n.layer)) return;
    const div = document.createElement('div');
    div.className = `node layer-${n.layer}`;
    div.id = `node-${n.id}`;
    div.style.left = n.x + 'px';
    div.style.top  = n.y + 'px';
    if (n.badge) {
      const b = document.createElement('div');
      b.className = 'node-badge';
      b.textContent = n.badge;
      div.appendChild(b);
    }
    const t = document.createElement('div');
    t.className = 'node-title';
    t.textContent = n.title;
    div.appendChild(t);
    const s = document.createElement('div');
    s.className = 'node-sub';
    s.textContent = n.sub;
    div.appendChild(s);
    div.addEventListener('click', () => showInfo(n));
    canvas.appendChild(div);
  });

  applySearch(searchTerm);
  applyViewPreset(currentView);
}

function renderEdges() {
  svgLayer.innerHTML = '';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  svgLayer.appendChild(defs);

  EDGES.forEach((e, i) => {
    const fromN = nodeById(e.from);
    const toN   = nodeById(e.to);
    if (!fromN || !toN) return;
    if (hiddenLayers.has(fromN.layer) || hiddenLayers.has(toN.layer)) return;

    // Approximate center of each node (width~140, height~52)
    const x1 = fromN.x + 70, y1 = fromN.y + 26;
    const x2 = toN.x + 70,   y2 = toN.y + 26;

    // Cubic bezier control points
    const cx = (x1 + x2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`);
    path.setAttribute('class', 'edge' + (e.flow ? ' flow' : ''));
    path.setAttribute('stroke', e.color);
    svgLayer.appendChild(path);
  });

  // Expand SVG to canvas bounds
  const maxX = Math.max(...VISIBLE_NODES.map(n=>n.x)) + 200;
  const maxY = Math.max(...VISIBLE_NODES.map(n=>n.y)) + 100;
  svgLayer.setAttribute('width', maxX);
  svgLayer.setAttribute('height', maxY);
}

function applyTransform() {
  canvas.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
}

function zoom(factor) {
  scale = Math.min(2, Math.max(0.2, scale * factor));
  applyTransform();
}

function resetView() {
  scale = 0.72; panX = 20; panY = 20;
  applyTransform();
}

// ─────────────────────────────────────────
// PAN
// ─────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
  wrap.classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  applyTransform();
});
document.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('dragging'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.1 : 0.9);
}, {passive:false});

// ─────────────────────────────────────────
// INFO PANEL
// ─────────────────────────────────────────
function showInfo(n) {
  if (selectedNode) document.getElementById(`node-${selectedNode.id}`)?.classList.remove('selected');
  selectedNode = n;
  document.getElementById(`node-${n.id}`)?.classList.add('selected');

  const colors = {user:'#388bfd',agent:'#3fb950',skills:'#bc8cff',mcp:'#d29922',platform:'#f85149',infra:'#39c5cf'};
  const c = colors[n.layer] || '#888';
  let html = `<h2>${n.title}</h2>`;
  html += `<span class="tag" style="background:${c}22;color:${c};border:1px solid ${c}44">${n.layer}</span>`;
  if (n.sub) html += `<span class="tag" style="background:#21262d;color:#8b949e;border:1px solid #30363d">${n.sub}</span>`;
  html += `<hr>`;
  html += `<p>${n.info.desc}</p>`;
  if (n.info.path) {
    html += `<div class="meta">Path / Config</div>`;
    html += `<div class="path">${n.info.path}</div>`;
  }
  if (n.info.files && n.info.files.length) {
    html += `<div class="meta">Key Files</div><ul>`;
    n.info.files.forEach(f => html += `<li class="path">${f}</li>`);
    html += `</ul>`;
  }
  if (n.info.links && n.info.links.length) {
    const linked = n.info.links.map(id => nodeById(id)).filter(Boolean);
    if (linked.length) {
      html += `<div class="meta">Connected To</div><ul>`;
      linked.forEach(ln => html += `<li>${ln.title} <span style="color:#484f58">(${ln.layer})</span></li>`);
      html += `</ul>`;
    }
  }
  document.getElementById('info-content').innerHTML = html;
  document.getElementById('info-panel').classList.add('visible');
}

function closeInfo() {
  if (selectedNode) document.getElementById(`node-${selectedNode.id}`)?.classList.remove('selected');
  selectedNode = null;
  document.getElementById('info-panel').classList.remove('visible');
}

// ─────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────
function doSearch(val) {
  searchTerm = val.toLowerCase().trim();
  applySearch(searchTerm);
}

function applySearch(term) {
  const count = document.getElementById('match-count');
  if (!term) {
    VISIBLE_NODES.forEach(n => {
      const el = document.getElementById(`node-${n.id}`);
      if (el) { el.classList.remove('dimmed','highlighted'); }
    });
    count.textContent = '';
    return;
  }
  let matches = 0;
  VISIBLE_NODES.forEach(n => {
    const el = document.getElementById(`node-${n.id}`);
    if (!el) return;
    const hit = n.title.toLowerCase().includes(term) || n.sub.toLowerCase().includes(term) || n.info.desc.toLowerCase().includes(term);
    if (hit) { el.classList.remove('dimmed'); el.classList.add('highlighted'); matches++; }
    else      { el.classList.add('dimmed');   el.classList.remove('highlighted'); }
  });
  count.textContent = `${matches} match${matches !== 1 ? 'es' : ''}`;
}

// ─────────────────────────────────────────
// LAYER TOGGLE
// ─────────────────────────────────────────
function toggleLayer(layer, show) {
  if (show) hiddenLayers.delete(layer);
  else      hiddenLayers.add(layer);
  renderNodes();
  renderEdges();
}

// ─────────────────────────────────────────
// VIEW PRESETS
// ─────────────────────────────────────────
function setView(name) {
  currentView = name;
  document.querySelectorAll('#toolbar .tb-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyViewPreset(name);
}

function applyViewPreset(name) {
  const ids = VIEWS[name];
  VISIBLE_NODES.forEach(n => {
    const el = document.getElementById(`node-${n.id}`);
    if (!el) return;
    if (!ids) { el.classList.remove('dimmed','highlighted'); }
    else if (ids.includes(n.id)) { el.classList.remove('dimmed'); el.classList.add('highlighted'); }
    else { el.classList.add('dimmed'); el.classList.remove('highlighted'); }
  });
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
renderNodes();
renderEdges();
applyTransform();
</script>
